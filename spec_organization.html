<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec Organization</title>
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="vendor/highlight-theme.min.css">
<style>
  :root{
    --bg: #eef0f3;
    --surface: #ffffff;
    --surface-alt: #f5f6f8;
    --border: #dde1e6;
    --text: #1b1f24;
    --text-dim: #5b6470;
    --text-faint: #98a1ab;
    --prompt: #ff8a3d;
    --prompt-soft: rgba(255, 138, 61, 0.16);
    --font-title: "Avenir Next", "Century Gothic", "Segoe UI", sans-serif;
    --font-system: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-content: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "IBM Plex Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text-dim);
    font-family: var(--font-system);
    font-size: 0.85rem;
    font-weight: 300;
    line-height: 1.5;
  }
  button, select{ font-family: inherit; }
  input, textarea{ font-family: var(--font-content); }

  .page{
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Top tab bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:22px;
    height:44px;
    flex-shrink:0;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar-tabs{ display:flex; align-items:stretch; height:100%; gap:4px; }
  .topbar-tab{
    display:flex; align-items:center;
    font-family: var(--font-title);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-decoration:none;
    padding: 0 6px;
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .topbar-tab:hover{ color: var(--text); }
  .topbar-tab.active{ color: var(--text); border-bottom-color: var(--prompt); }
  .topbar-profile{
    display:flex; align-items:center; gap:8px;
    margin-left:auto;
    color: var(--text-dim);
  }
  .topbar-avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background: var(--surface-alt); border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-title); font-size:0.7rem; font-weight:700; color: var(--text-dim);
  }
  .topbar-profile-name{ font-family: var(--font-system); font-weight:400; font-size:0.8rem; }

  .app{
    display:flex;
    flex:1;
    min-height:0;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 22%;
    min-width: 190px;
    max-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition: width .2s ease, min-width .2s ease;
    flex-shrink:0;
  }
  .sidebar.collapsed{ width: 48px; min-width: 48px; }
  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .sidebar-title{
    font-family: var(--font-title);
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--text);
  }
  .sidebar.collapsed .sidebar-title{ display:none; }
  #sidebar-toggle{
    background:none; border:1px solid var(--border); border-radius:5px;
    width:26px; height:26px; cursor:pointer; color: var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:0.9rem;
    flex-shrink:0;
  }
  #sidebar-toggle:hover{ background: var(--surface-alt); }
  .sidebar-scroll{
    overflow-y:auto;
    flex:1;
    padding: 6px 0 20px;
  }
  .sidebar.collapsed .sidebar-scroll{ display:none; }

  .file-list{ padding: 2px 0 6px; }
  .file-row{
    display:block;
    width: calc(100% - 24px);
    margin: 0 0 4px 12px;
    text-align:left;
    background:none;
    border:none;
    border-left: 2px solid var(--border);
    cursor:pointer;
    padding: 8px 10px;
    font-family: var(--font-content);
    font-weight: 400;
    color: var(--text);
    transition: background-color .15s ease, border-color .15s ease;
  }
  .file-row:hover{
    background: var(--surface-alt);
    border-left-color: var(--text-dim);
  }
  .file-row.active{
    background: var(--surface-alt);
    border-left-color: var(--prompt);
    font-weight: 600;
  }
  .sidebar-empty{ color: var(--text-faint); font-style: italic; padding: 8px 14px; }

  /* ---------- Center ---------- */
  .center{
    flex:1;
    min-width: 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .center-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    border-bottom: 1px solid var(--border);
    padding: 18px 32px 14px;
    flex-shrink:0;
  }
  .center-head .center-title{
    font-family: var(--font-title);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  .center-head .file-name{
    font-family: var(--font-content);
    font-weight: 700;
    color: var(--text);
  }
  .view-tabs{ display:flex; gap:4px; margin-left:auto; }
  .view-tabs[hidden]{ display:none; }
  .view-tabs button{
    background:none; border:1px solid var(--border); border-radius:5px; padding:5px 12px;
    cursor:pointer;
  }
  .view-tabs button.active{ background: var(--surface-alt); font-weight:600; border-color: var(--text-faint); }
  .save-status{ margin-left:12px; }
  .save-status.err{ color: #b5453d; }
  .save-status.ok{ color: #4c8a58; }

  /* ---------- add new spec ---------- */
  .file-row.add-row{ color:#3a6b46; font-weight:600; }
  .file-row.add-row .draft-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background: var(--prompt); margin-left:8px; vertical-align:middle;
  }
  .title-input{
    flex:1;
    min-width: 160px;
    max-width: 420px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--font-content);
    font-weight: 700;
    padding: 6px 10px;
  }
  .title-input:focus{ outline: 2px solid #b8c6d9; outline-offset:1px; }
  .title-input[hidden]{ display:none; }
  /* the filename the title will produce -- shown before Save so the rule is never a surprise */
  .new-spec-hint{
    flex-shrink:0;
    padding: 8px 32px;
    border-bottom: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 0.78rem;
  }
  .new-spec-hint[hidden]{ display:none; }
  .new-spec-hint code{
    font-family: var(--mono); font-size: 0.95em; color: var(--text);
    background: var(--surface-alt); border-radius:4px; padding:1px 5px;
  }
  .new-spec-hint.warn{ color:#a85a1f; }
  .new-spec-hint.err{ color:#b5453d; }

  .spec-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding: 22px 32px 60px;
  }
  .spec-empty{ color: var(--text-faint); font-style: italic; }

  #spec-editor{
    width:100%;
    height:100%;
    min-height: 60vh;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
    line-height:1.5;
    padding: 14px 16px;
    resize: vertical;
  }
  #spec-editor:focus{ outline: 2px solid #b8c6d9; outline-offset:1px; }

  button.primary{
    background:#e9f1eb; border: 1px solid #bcd9c2; color:#3a6b46;
    border-radius: 6px; padding: 9px 14px; cursor:pointer; font-weight:600;
  }
  button.primary:hover{ border-color:#3a6b46; }
  button.primary:disabled{ opacity:0.5; cursor:default; }

  /* ---------- rendered markdown ---------- */
  .rendered-content{ font-family: var(--font-content); font-weight: 400; color: var(--text); line-height:1.55; }
  .rendered-content p{ margin: 0 0 0.7em; }
  .rendered-content p:last-child{ margin-bottom:0; }
  .rendered-content pre{
    background:#1e1e1e; border-radius:6px; padding:10px 12px; overflow-x:auto;
    font-size:0.8rem; margin: 0.6em 0;
  }
  .rendered-content pre code{ font-family: var(--mono); background:none; padding:0; }
  .rendered-content code{
    font-family: var(--mono); background: var(--surface-alt); border-radius:4px; padding:1px 5px; font-size:0.85em;
  }
  .rendered-content ul, .rendered-content ol{ margin: 0.4em 0; padding-left: 1.4em; }
  .rendered-content blockquote{
    border-left: 3px solid var(--border); margin: 0.6em 0; padding: 2px 12px;
  }
  .rendered-content h1, .rendered-content h2, .rendered-content h3{
    font-family: var(--font-content); margin: 0.6em 0 0.3em;
  }
  .rendered-content table{ border-collapse:collapse; margin: 0.6em 0; }
  .rendered-content th, .rendered-content td{ border:1px solid var(--border); padding:4px 8px; }
  .rendered-content a{ color:#3a6b46; }
  .rendered-content img{ max-width:100%; }

  .load-error{
    background: #fdf1ef; border: 1px solid #f0c9c2; color: #8a3a30;
    border-radius: 8px; padding: 16px 18px;
  }
  .load-error code{ background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <nav class="topbar-tabs">
      <a class="topbar-tab" href="/">Ai Log</a>
      <a class="topbar-tab active" href="/spec">Spec Organization</a>
      <a class="topbar-tab" href="/long">Long Conversation</a>
    </nav>
    <div class="topbar-profile">
      <span class="topbar-avatar">P</span>
      <span class="topbar-profile-name">Pedley</span>
    </div>
  </header>

<div class="app">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-title">SPEC INDEX</span>
      <button id="sidebar-toggle" aria-label="Toggle sidebar">&lsaquo;</button>
    </div>
    <div class="sidebar-scroll" id="sidebar-scroll"></div>
  </nav>

  <main class="center">
    <div class="center-head">
      <span class="center-title">SPEC</span>
      <span class="file-name" id="file-name"></span>
      <input type="text" class="title-input" id="new-spec-title" placeholder="Spec title" autocomplete="off" hidden>
      <div class="view-tabs" id="view-tabs" hidden>
        <button type="button" data-tab="preview" class="active" id="tab-preview">Preview</button>
        <button type="button" data-tab="edit" id="tab-edit">Edit</button>
      </div>
      <button class="primary" id="save-btn" hidden>Save</button>
      <span class="save-status" id="save-status"></span>
    </div>
    <div class="new-spec-hint" id="new-spec-hint" hidden></div>
    <div class="spec-body" id="spec-body">
      <div class="spec-empty">Select a spec from the sidebar to preview or edit it, or add a new one.</div>
    </div>
  </main>

</div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/dompurify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/hljs-lang/python.min.js"></script>
<script src="vendor/hljs-lang/javascript.min.js"></script>
<script src="vendor/hljs-lang/typescript.min.js"></script>
<script src="vendor/hljs-lang/bash.min.js"></script>
<script src="vendor/hljs-lang/json.min.js"></script>
<script src="vendor/hljs-lang/xml.min.js"></script>
<script src="vendor/hljs-lang/css.min.js"></script>
<script src="vendor/hljs-lang/c.min.js"></script>
<script src="vendor/hljs-lang/cpp.min.js"></script>
<script src="vendor/hljs-lang/java.min.js"></script>
<script src="vendor/hljs-lang/sql.min.js"></script>
<script src="vendor/hljs-lang/yaml.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/katex-auto-render.min.js"></script>
<script>
(function(){

  // the server rejects longer names, so the filename hint says so before Save does
  const MAX_SPEC_NAME_CHARS = 100;

  let files = [];
  let current = null; // { name, content }
  let activeTab = 'preview';

  /* A new spec being written. The draft lives here rather than in the DOM so it
     survives browsing to another spec and back: `creating` says whether its pane
     is showing, `newSpec` is the text (null once saved or never started). */
  let creating = false;
  let newSpec = null; // { title, content }
  let saving = false;
  let serverError = '';

  const sidebarScroll = document.getElementById('sidebar-scroll');
  const specBody = document.getElementById('spec-body');
  const fileNameEl = document.getElementById('file-name');
  const titleInput = document.getElementById('new-spec-title');
  const hintEl = document.getElementById('new-spec-hint');
  const viewTabs = document.getElementById('view-tabs');
  const tabPreview = document.getElementById('tab-preview');
  const tabEdit = document.getElementById('tab-edit');
  const saveBtn = document.getElementById('save-btn');
  const statusEl = document.getElementById('save-status');

  // the document the Preview/Edit tabs are showing: the draft while creating
  function activeDoc(){ return creating ? newSpec : current; }

  function draftHasText(){
    return !!(newSpec && (newSpec.title.trim() || newSpec.content.trim()));
  }

  /* ---------- markdown rendering (same approach as the Ai Log page) ---------- */
  let markedConfigured = false;
  function configureMarked(){
    if(markedConfigured) return;
    marked.setOptions({ breaks: true, gfm: true });
    const renderer = new marked.Renderer();
    renderer.code = function(code, infostring){
      const lang = (infostring || '').trim().split(/\s+/)[0];
      let highlighted;
      if(window.hljs && lang && hljs.getLanguage(lang)){
        highlighted = hljs.highlight(code, { language: lang }).value;
      } else if(window.hljs){
        highlighted = hljs.highlightAuto(code).value;
      } else {
        highlighted = code.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      }
      return '<pre><code class="hljs' + (lang ? ' language-' + lang : '') + '">' + highlighted + '</code></pre>';
    };
    marked.use({ renderer });
    markedConfigured = true;
  }

  function renderMarkdown(el, text){
    configureMarked();
    const rawHtml = marked.parse(text || '');
    el.innerHTML = window.DOMPurify ? DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target'] }) : rawHtml;
    if(window.renderMathInElement){
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    }
  }

  /* ---------- sidebar ---------- */
  function renderSidebar(){
    sidebarScroll.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'file-list';

    // always first, and present even when the directory is empty -- that is
    // exactly when it is needed
    const addRow = document.createElement('button');
    addRow.id = 'add-spec-row';
    addRow.className = 'file-row add-row' + (creating ? ' active' : '');
    addRow.textContent = '+ Add New Spec';
    if(!creating && draftHasText()){
      const dot = document.createElement('span');
      dot.className = 'draft-dot';
      dot.title = 'Unsaved draft';
      addRow.appendChild(dot);
    }
    addRow.addEventListener('click', openNewSpec);
    list.appendChild(addRow);

    files.forEach(name => {
      const row = document.createElement('button');
      row.className = 'file-row' + (!creating && current && current.name === name ? ' active' : '');
      row.textContent = name;
      row.addEventListener('click', () => selectFile(name));
      list.appendChild(row);
    });
    sidebarScroll.appendChild(list);

    if(files.length === 0){
      const empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = 'No specs yet.';
      sidebarScroll.appendChild(empty);
    }
  }

  /* ---------- new spec: title -> filename ---------- */

  /* camelCase the title into a filename: "Korean Note Generation" ->
     koreanNoteGeneration.md. Anything that isn't a letter or digit separates
     words, which is also all the server will accept in a spec name. */
  function filenameFromTitle(title){
    const words = title.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    if(words.length === 0) return '';
    const stem = words.map((word, i) => {
      const chars = Array.from(word.toLowerCase());
      return i === 0 ? chars.join('') : chars[0].toUpperCase() + chars.slice(1).join('');
    }).join('');
    return stem + '.md';
  }

  /* what Save would do with the current title, and why not if it can't */
  function describeNewSpec(){
    const title = newSpec.title.trim();
    if(!title){
      return { ok:false, kind:'', text:'Type a title — it becomes the filename.' };
    }
    const name = filenameFromTitle(title);
    if(!name){
      return { ok:false, kind:'warn', text:'The title needs at least one letter or number.' };
    }
    if(Array.from(name).length - '.md'.length > MAX_SPEC_NAME_CHARS){
      return { ok:false, kind:'warn', text:'That title is too long for a filename (limit ' + MAX_SPEC_NAME_CHARS + ' characters).' };
    }
    if(files.some(f => f.toLowerCase() === name.toLowerCase())){
      return { ok:false, kind:'err', name, text: name + ' already exists.' };
    }
    return { ok:true, kind:'', name };
  }

  function updateNewSpecState(){
    if(!creating || !newSpec) return;
    const state = describeNewSpec();
    hintEl.className = 'new-spec-hint';
    hintEl.textContent = '';
    if(serverError){
      hintEl.classList.add('err');
      hintEl.textContent = serverError;
    } else if(state.ok){
      hintEl.append('Saves as ');
      const code = document.createElement('code');
      code.textContent = state.name;
      hintEl.appendChild(code);
    } else {
      if(state.kind) hintEl.classList.add(state.kind);
      hintEl.textContent = state.text;
    }
    // a server refusal stands until the title changes, so retrying can't just repeat it
    saveBtn.disabled = saving || !state.ok || !!serverError;
  }

  /* header controls for whichever mode is showing */
  function syncHead(){
    const doc = activeDoc();
    fileNameEl.hidden = creating;
    fileNameEl.textContent = creating || !current ? '' : current.name;
    titleInput.hidden = !creating;
    hintEl.hidden = !creating;
    viewTabs.hidden = !doc;
    saveBtn.hidden = !doc;
    tabPreview.classList.toggle('active', activeTab === 'preview');
    tabEdit.classList.toggle('active', activeTab === 'edit');
    if(creating){
      updateNewSpecState();
    } else {
      saveBtn.disabled = false;
    }
  }

  function openNewSpec(){
    if(!newSpec) newSpec = { title:'', content:'' };
    creating = true;
    activeTab = 'edit';
    serverError = '';
    statusEl.textContent = '';
    statusEl.className = 'save-status';
    titleInput.value = newSpec.title;
    syncHead();
    renderSidebar();
    renderBody();
    titleInput.focus();
  }

  /* ---------- preview / edit body ---------- */
  function renderBody(){
    specBody.innerHTML = '';
    const doc = activeDoc();
    if(!doc){
      specBody.innerHTML = '<div class="spec-empty">Select a spec from the sidebar to preview or edit it, or add a new one.</div>';
      return;
    }
    const preview = document.createElement('div');
    preview.className = 'rendered-content';
    preview.id = 'spec-preview';
    const editor = document.createElement('textarea');
    editor.id = 'spec-editor';
    editor.value = doc.content;

    if(activeTab === 'preview'){
      editor.hidden = true;
      if(creating && !doc.content.trim()){
        preview.innerHTML = '<div class="spec-empty">Nothing to preview yet.</div>';
      } else {
        renderMarkdown(preview, doc.content);
      }
    } else {
      preview.hidden = true;
    }

    if(creating){
      editor.placeholder = 'Write the spec in markdown…';
      // keep the draft current as you type, so nothing depends on the DOM surviving
      editor.addEventListener('input', () => {
        newSpec.content = editor.value;
        updateNewSpecState();
      });
      editor.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
          e.preventDefault();
          createSpec();
        }
      });
    }

    specBody.appendChild(preview);
    specBody.appendChild(editor);
  }

  function switchTab(tab){
    activeTab = tab;
    tabPreview.classList.toggle('active', tab === 'preview');
    tabEdit.classList.toggle('active', tab === 'edit');
    const doc = activeDoc();
    if(tab === 'preview' && doc){
      const editor = document.getElementById('spec-editor');
      if(editor) doc.content = editor.value;
    }
    renderBody();
  }

  titleInput.addEventListener('input', () => {
    if(!newSpec) return;
    newSpec.title = titleInput.value;
    serverError = '';
    updateNewSpecState();
  });
  titleInput.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(e.ctrlKey || e.metaKey){
      createSpec();
      return;
    }
    // plain Enter moves on to the body rather than saving, so a half-typed
    // title can't create a file
    if(activeTab !== 'edit') switchTab('edit');
    const editor = document.getElementById('spec-editor');
    if(editor) editor.focus();
  });

  // closing the tab with a draft parked or showing would throw it away
  window.addEventListener('beforeunload', (e) => {
    if(draftHasText()){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  tabPreview.addEventListener('click', () => switchTab('preview'));
  tabEdit.addEventListener('click', () => switchTab('edit'));

  /* ---------- server sync ---------- */
  async function loadFileList(){
    try{
      const res = await fetch('/api/markdown/list');
      if(!res.ok) throw new Error('server responded ' + res.status);
      const data = await res.json();
      files = data.files || [];
      renderSidebar();
    }catch(err){
      sidebarScroll.innerHTML = '';
      specBody.innerHTML = '<div class="load-error">Could not reach the log server.<br>'
        + 'Make sure <code>server.py</code> is running and you opened this page as '
        + '<code>http://localhost:8420/spec</code> — not by double-clicking the file.</div>';
    }
  }

  async function selectFile(name){
    try{
      const res = await fetch('/api/markdown/file?name=' + encodeURIComponent(name));
      if(!res.ok) throw new Error('server responded ' + res.status);
      const data = await res.json();
      current = { name, content: data.content || '' };
      // leaving the new-spec pane parks the draft (newSpec) rather than dropping it
      creating = false;
      activeTab = 'preview';
      statusEl.textContent = '';
      statusEl.className = 'save-status';
      syncHead();
      renderSidebar();
      renderBody();
    }catch(err){
      statusEl.textContent = 'Could not load file';
      statusEl.className = 'save-status err';
    }
  }

  /* The draft is only cleared once the server has confirmed the new file, so a
     refusal or a dead connection leaves everything typed exactly where it was.
     The server never overwrites: a name that already exists comes back as 409. */
  async function createSpec(){
    if(!creating || !newSpec || saving) return;
    const state = describeNewSpec();
    if(!state.ok || serverError) return;

    const editor = document.getElementById('spec-editor');
    if(editor) newSpec.content = editor.value;

    saving = true;
    updateNewSpecState();
    statusEl.textContent = 'Saving…';
    statusEl.className = 'save-status';
    try{
      const res = await fetch('/api/markdown/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name: state.name, content: newSpec.content })
      });
      if(res.status === 400 || res.status === 409){
        const data = await res.json().catch(() => ({}));
        serverError = data.error || 'The server could not create this spec.';
        statusEl.textContent = '';
        if(res.status === 409) await loadFileList();
        return;
      }
      if(!res.ok) throw new Error('save failed');

      newSpec = null;
      creating = false;
      serverError = '';
      titleInput.value = '';
      await loadFileList();
      await selectFile(state.name);
      syncHead();
      renderSidebar();
      renderBody();
      statusEl.textContent = 'Saved';
      statusEl.className = 'save-status ok';
    }catch(err){
      statusEl.textContent = 'Save failed — is the server running?';
      statusEl.className = 'save-status err';
    }finally{
      saving = false;
      updateNewSpecState();
    }
  }

  saveBtn.addEventListener('click', async () => {
    if(creating){
      createSpec();
      return;
    }
    if(!current) return;
    const editor = document.getElementById('spec-editor');
    if(editor) current.content = editor.value;
    statusEl.textContent = 'Saving…';
    statusEl.className = 'save-status';
    try{
      const res = await fetch('/api/markdown/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name: current.name, content: current.content })
      });
      if(!res.ok) throw new Error('save failed');
      statusEl.textContent = 'Saved';
      statusEl.className = 'save-status ok';
      if(activeTab === 'preview') renderBody();
    }catch(err){
      statusEl.textContent = 'Save failed — is the server running?';
      statusEl.className = 'save-status err';
    }
  });

  /* ---------- sidebar collapse toggle ---------- */
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('sidebar-toggle');
    sidebar.classList.toggle('collapsed');
    btn.innerHTML = sidebar.classList.contains('collapsed') ? '&rsaquo;' : '&lsaquo;';
  });

  loadFileList();
})();
</script>
</body>
</html>
